<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Thulla has moved</title>
<link rel="canonical" href="https://play.orcavalley.com/thulla/">
<script>
// Thulla now lives at https://play.orcavalley.com/thulla/. This page sends players there, keeping ?room=, and packs this
// game's saved names and settings into the address (#carry=...) so the new page can import them once.
(function () {
  var url = 'https://play.orcavalley.com/thulla/' + location.search;
  var prefixes = ["thulla-"];
  try {
    var out = {}, n = 0;
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (prefixes.some(function (p) { return k.indexOf(p) === 0; })) { out[k] = localStorage.getItem(k); n++; }
    }
    if (n) {
      var bytes = new TextEncoder().encode(JSON.stringify(out)), bin = '';
      for (var j = 0; j < bytes.length; j++) bin += String.fromCharCode(bytes[j]);
      url += '#carry=' + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
  } catch (e) { /* storage blocked: go without it */ }
  location.replace(url);
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://play.orcavalley.com/thulla/"></noscript>
<style>
  :root { --bg: #e9ecf7; --ink: #1b1e3a; --muted: #5d6285; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e0f12; --ink: #e8e9ec; --muted: #8d919b; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 1.05rem/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; padding: 0 16px; text-align: center; }
  a { color: var(--ink); font-weight: 600; }
  p { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Thulla has moved</h1>
  <p>Taking you to <a href="https://play.orcavalley.com/thulla/">https://play.orcavalley.com/thulla/</a>…</p>
</main>
</body>
</html>
